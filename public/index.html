<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#f7f7f8"/>
  <title>Family GPT</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">Family GPT</div>
      <div class="mode-label">MODE</div>
      <button class="mode-button active" data-mode="web"><span>GPT Web</span><small>기본 · 실제 ChatGPT</small></button>
      <button class="mode-button" data-mode="codex"><span>Codex</span><small>보조 · 실험</small></button>
      <div class="sidebar-spacer"></div>
      <div id="sidebarStatus" class="sidebar-status">상태 확인 중…</div>
    </aside>

    <main class="main-shell">
      <section class="chat">
        <header>
          <div class="title-group">
            <button id="menuToggle" class="menu-toggle" aria-label="메뉴">☰</button>
            <div><strong id="modeTitle">GPT Web</strong><span id="status" class="status">연결 확인 중</span></div>
          </div>
          <div class="header-actions"><span id="modelPill" class="model-pill">GPT-5.6 Sol</span><button id="newChat" class="secondary">새 대화</button></div>
        </header>
        <div id="messages" class="messages"><div class="empty" id="empty">무엇이든 물어보세요</div></div>
        <form id="composer" class="composer"><textarea id="prompt" rows="2" placeholder="메시지 입력"></textarea><button id="send" type="submit">보내기</button></form>
      </section>
    </main>
    <button id="backdrop" class="backdrop" aria-label="메뉴 닫기"></button>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
